services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aives-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - aives-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  web:
    build:
      context: .
      dockerfile: AIpoweredVivaExamSystem.Web/Dockerfile

    container_name: aives-web

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in your local .env (at least 32 random bytes)}"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AIpoweredVivaExamSystemDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"

    ports:
      - "8081:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - aives-network

    restart: unless-stopped


volumes:
  sqlserver_data:


networks:
  aives-network:
    driver: bridge
